# =============================================================================
# cd-staging.yml — Continuous Deployment: Staging
#
# Triggers when a push or merge lands on the `staging` branch.
# Pipeline:
#   1. Build Docker image (prod target) and push to Docker Hub
#   2. SSH into VPS → pull new image → redeploy staging container
# =============================================================================

name: CD — Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    name: Build, Push & Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging          # maps to GitHub Environment "staging"

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set image tag — use short SHA for traceability
      # -----------------------------------------------------------------------
      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/nusagizi-be" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 3. Log in to Docker Hub
      # -----------------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 4. Set up Docker Buildx (for layer caching)
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 5. Build and push image — targets prod stage in Dockerfile
      #    Tags: staging-<sha>  +  staging-latest
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 6. Deploy to VPS via SSH
      #    - Pulls new image from Docker Hub
      #    - Updates docker-compose.staging.yml to use the pushed image
      #    - Restarts only the backend-staging container (zero-downtime restart)
      # -----------------------------------------------------------------------
      - name: Deploy to VPS (Staging)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            IMAGE="${{ steps.meta.outputs.image }}:staging-latest"
            STAGING_DIR="${{ secrets.VPS_STAGING_DIR }}"

            echo "=== [1/4] Pulling new image: $IMAGE ==="
            docker pull "$IMAGE"

            echo "=== [2/4] Moving to staging directory ==="
            cd "$STAGING_DIR"

            echo "=== [3/4] Updating BACKEND_IMAGE in .env.staging ==="
            # Write/overwrite the image tag so docker-compose picks it up
            if grep -q "^BACKEND_IMAGE=" .env.staging 2>/dev/null; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$IMAGE|" .env.staging
            else
              echo "BACKEND_IMAGE=$IMAGE" >> .env.staging
            fi

            echo "=== [4/4] Redeploying staging container ==="
            make staging-up

            echo "=== Staging deploy complete ==="
            docker ps --filter "name=nusagizi-backend-staging" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
