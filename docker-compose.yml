# =============================================================================
# docker-compose.yml — Base configuration (shared infrastructure only)
#
# Contains only shared services. Backend services are defined in:
#
#   Staging: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#   Prod   : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — shared instance, two separate databases (staging & prod)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nusagizi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nusagizi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nusagizi_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the staging database on first container startup
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - prod-network
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nusagizi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
    driver: local

networks:
  # Isolated network for production containers
  prod-network:
    driver: bridge
    name: nusagizi-prod-net

  # Isolated network for staging containers
  staging-network:
    driver: bridge
    name: nusagizi-staging-net
