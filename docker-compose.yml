# =============================================================================
# docker-compose.yml — Base configuration (shared infrastructure only)
#
# Contains only shared services: postgres and minio.
# Backend services are defined in the override files:
#
#   Dev : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — shared instance, two separate databases (dev & prod)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nusagizi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nusagizi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nusagizi_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the dev database on first container startup
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - prod-network
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nusagizi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # MinIO — shared instance, two separate buckets (dev & prod)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: nusagizi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - prod-network
      - dev-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  # Isolated network for production containers
  prod-network:
    driver: bridge
    name: nusagizi-prod-net

  # Isolated network for development containers
  dev-network:
    driver: bridge
    name: nusagizi-dev-net
