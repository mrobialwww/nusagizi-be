# =============================================================================
# docker-compose.base-staging.yml — External resource references for staging directory
#
# Used instead of docker-compose.yml when running from the staging directory.
# Declares networks as external so Docker reuses what the prod directory owns.
#
# Usage (via Makefile):
#   docker compose -f docker-compose.base-staging.yml -f docker-compose.staging.yml up -d
# =============================================================================

networks:
  prod-network:
    external: true
    name: nusagizi-prod-net

  staging-network:
    external: true
    name: nusagizi-staging-net
