# =============================================================================
# docker-compose.prod.yml — Production services
#
# Cara pakai:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Atau via Makefile:
#   make prod-up
# =============================================================================

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      # Console MinIO — akses via SSH tunnel jika perlu:
      # ssh -L 9001:localhost:9001 user@vps
      # - "127.0.0.1:9001:9001"

  # ---------------------------------------------------------------------------
  # Backend Production — didefinisikan penuh di sini, tidak ada di base
  # ---------------------------------------------------------------------------
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: nusagizi-backend:prod
    container_name: nusagizi-backend-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-nusagizi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nusagizi_prod}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
