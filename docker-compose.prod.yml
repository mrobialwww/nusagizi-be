# =============================================================================
# docker-compose.prod.yml — Production services
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or via Makefile:
#   make prod-up
# =============================================================================

services:
  postgres:
    # Bind to localhost only — not exposed to public
    ports:
      - "127.0.0.1:5432:5432"

  # ---------------------------------------------------------------------------
  # Production backend — fully defined here, not present in base
  #
  # In CI/CD: image is pulled from Docker Hub by GitHub Actions.
  # The BACKEND_IMAGE env var is written by the CD workflow before make prod-up.
  # Fallback to a local build tag if running manually without Docker Hub access.
  # ---------------------------------------------------------------------------
  backend-prod:
    image: ${BACKEND_IMAGE:-nusagizi-backend:prod}
    container_name: nusagizi-backend-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      PORT: 8080
      GIN_MODE: release
      DATABASE_URL: postgres://${POSTGRES_USER:-nusagizi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nusagizi_prod}?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod-network
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
